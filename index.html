<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Patents Portal | Innovation & Robotics Showcase</title>

  <!-- SEO Meta Tags -->
  <meta name="description"
    content="Explore the official intellectual property portfolio showcasing state-of-the-art developments in AI accelerators, bio-mimetic robotics, autonomous subsea systems, and smart mobility.">
  <meta name="keywords"
    content="Patents, Intellectual Property, AI Multiplier, Robotics, AUV Systems, Exoskeleton, Space Rover, Head-Up Display">
  <meta name="author" content="Research Group">

  <!-- Open Graph / Social Media -->
  <meta property="og:title" content="Patents Portal">
  <meta property="og:description"
    content="6 Videos">
  <meta property="og:type" content="website">

  <!-- Styling -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-container">

    <!-- Header Area -->
    <header class="app-header">
      <div class="brand-container">
        <div class="brand-icon">
          <!-- Multi-layered isometric cube representing innovation and patents -->
          <svg class="brand-logo-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5z"></path>
            <path d="M2 17l10 5 10-5"></path>
            <path d="M2 12l10 5 10-5"></path>
          </svg>
        </div>
        <div class="brand-text">
          <h1>Patents Portal</h1>
          <p>Intellectual Property &amp; Robotics Showcase</p>
        </div>
      </div>

      <div class="header-actions">
        <div class="theme-toggle-wrapper">
          <button id="theme-light-btn" class="theme-toggle-btn" aria-label="Switch to Light Theme">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12 7c-2.76 0-5 2.24-5 5s2.24 5 5 5s5-2.24 5-5s-2.24-5-5-5zM2 13h2c.55 0 1-.45 1-1s-.45-1-1-1H2c-.55 0-1 .45-1 1s.45 1 1 1zm18 0h2c.55 0 1-.45 1-1s-.45-1-1-1h-2c-.55 0-1 .45-1 1s.45 1 1 1zM11 2v2c0 .55.45 1 1 1s1-.45 1-1V2c0-.55-.45-1-1-1s-1 .45-1 1zm0 18v2c0 .55.45 1 1 1s1-.45 1-1v-2c0-.55-.45-1-1-1s-1 .45-1 1zM5.99 4.58c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41L5.99 4.58zm12.37 12.37c-.39-.39-1.03-.39-1.41 0s-.39 1.03 0 1.41l1.06 1.06c.39.39 1.03.39 1.41 0s.39-1.03 0-1.41l-1.06-1.06zm1.06-10.96c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06zM7.05 18.01c.39-.39.39-1.03 0-1.41s-1.03-.39-1.41 0l-1.06 1.06c-.39.39-.39 1.03 0 1.41s1.03.39 1.41 0l1.06-1.06z" />
            </svg>
            <span>Light</span>
          </button>
          <button id="theme-dark-btn" class="theme-toggle-btn active" aria-label="Switch to Dark Theme">
            <svg viewBox="0 0 24 24" fill="currentColor">
              <path d="M12.3 22h-.1c-5.5-.1-10-4.6-10-10.1c0-4.7 3.3-8.8 8-9.8c.6-.1 1.2.3 1.3.9c.1.6-.3 1.2-.9 1.3C7 5 4.7 8.3 4.7 12c0 4.1 3.4 7.4 7.5 7.4c2.8 0 5.4-1.5 6.7-4c.3-.5.9-.7 1.4-.5c.5.2.8.8.6 1.3c-1.7 3.6-5.4 5.8-8.6 5.8z" />
            </svg>
            <span>Dark</span>
          </button>
        </div>
      </div>
    </header>



    <!-- Search Bar -->
    <div class="search-bar-container">
      <div class="search-box-wrapper">
        <input type="text" id="search-input" class="search-input"
          placeholder="Type the name to search" aria-label="Search patents">
        <div class="search-icon">
          <svg fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" />
          </svg>
        </div>
      </div>
    </div>

    <!-- Patents Card Grid -->
    <main id="patents-grid" class="patents-grid">
      <!-- Rendered dynamically by app.js -->
    </main>



  </div>

  <!-- Video Presentation Modal Overlay -->
  <div id="video-modal" class="modal-overlay" aria-hidden="true" role="dialog">
    <div class="modal-container">

      <!-- Modal Header -->
      <div class="modal-header">
        <div class="modal-title-wrapper">
          <h2 id="modal-title" class="modal-title">Patent Title</h2>
        </div>
        <button id="modal-close" class="modal-close-btn" aria-label="Close dialog" title="Close">
          <svg viewBox="0 0 24 24">
            <path
              d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z" />
          </svg>
        </button>
      </div>

      <!-- Modal Body -->
      <div class="modal-body">

        <!-- Video Player Frame -->
        <div class="video-wrapper">
          <iframe id="video-player-iframe" src="" allow="autoplay; encrypted-media" allowfullscreen
            title="Patent Demonstration Video">
          </iframe>
        </div>

      </div>

    </div>
  </div>

  <!-- Toast Notification -->
  <div id="toast-notification" class="toast" role="status">
    <svg class="toast-icon" width="20" height="20" fill="none" viewBox="0 0 24 24" stroke="currentColor"
      stroke-width="3">
      <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7" />
    </svg>
    Video Link Copied to Clipboard
  </div>

  <!-- Import Patents Data and App Controller -->
  <script src="patentsData.js"></script>
  <script src="app.js"></script>
</body>

</html>
